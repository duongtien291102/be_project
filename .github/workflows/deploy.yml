name: Build & Deploy Backend to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hotel-backend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build JAR with Maven
        run: ./mvnw clean package -DskipTests --batch-mode

      - name: Setup SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          mkdir -p $HOME/.ssh
          echo "$SSH_KEY_B64" | base64 -d > $HOME/.ssh/deploy_key
          chmod 600 $HOME/.ssh/deploy_key
          chmod 700 $HOME/.ssh
          ssh-keygen -l -f $HOME/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> $HOME/.ssh/known_hosts 2>/dev/null

      - name: Copy JAR to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i $HOME/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o BatchMode=yes \
              target/be_project-0.0.1-SNAPSHOT.jar \
              "$VPS_USER@$VPS_HOST:/tmp/be_project-0.0.1-SNAPSHOT.jar"

      - name: Deploy & Restart Backend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i $HOME/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o BatchMode=yes \
              "$VPS_USER@$VPS_HOST" \
              'set -e
               echo "Deploy Backend JAR len /opt/hotel-backend..."
               systemctl stop hotel-backend
               cp /tmp/be_project-0.0.1-SNAPSHOT.jar /opt/hotel-backend/app.jar
               systemctl start hotel-backend
               sleep 8
               systemctl is-active hotel-backend
               echo "Backend deploy thanh cong! Port 2402"'
