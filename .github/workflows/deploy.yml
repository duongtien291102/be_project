name: Build & Deploy Backend to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hotel-backend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build JAR with Maven
        run: ./mvnw clean package -DskipTests --batch-mode

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy JAR to VPS via SCP
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            target/be_project-0.0.1-SNAPSHOT.jar \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/be_project-0.0.1-SNAPSHOT.jar

      - name: Deploy & Restart Backend service
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
          set -e
          echo "Deploy Backend JAR len /opt/hotel-backend..."
          systemctl stop hotel-backend
          cp /tmp/be_project-0.0.1-SNAPSHOT.jar /opt/hotel-backend/app.jar
          systemctl start hotel-backend
          sleep 8
          systemctl is-active hotel-backend
          echo "Backend deploy thanh cong! Port 2402"
          ENDSSH
