server:
  port: ${SERVER_PORT:2402}

spring:
  application:
    name: be_project
  config:
    import: optional:file:.env[.properties]
  mongodb:
    uri: ${MONGODB_URI}
  data:
    mongodb:
      uri: ${MONGODB_URI}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  sysadmin:
    username: ${SYSADMIN_USERNAME:sysadmin}
    password: ${SYSADMIN_PASSWORD:}
    email: ${SYSADMIN_EMAIL:sysadmin@grandhotel.vn}
    fullName: ${SYSADMIN_FULLNAME:Hệ Thống Quản Trị Cấp Cao (SysAdmin)}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5555,http://localhost:2902,http://127.0.0.1:5555,http://127.0.0.1:2902}
